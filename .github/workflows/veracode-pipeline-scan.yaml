name: Veracode Pipeline Scan
on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  veracode-pipeline-scanning:
    uses: GS-MAFTech/veracode-reusable-workflows/.github/workflows/Veracode-PipelineScan.yml@dev
    secrets:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
