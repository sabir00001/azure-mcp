name: Veracode Auto-Packaging Policy Scan
on:
  push:
    branches:
      - main
  schedule:
    
    - cron: '0 0 1 3,6,9,12 *'
  workflow_dispatch:

jobs:
  sca-scan:
    uses: GS-MAFTech/veracode-reusable-workflows/.github/workflows/veracode-sca.yml@dev
    secrets:
      SRCCLR_API_TOKEN: ${{ secrets.VERACODE_SCA_AGENT_TOKEN }}
  call-veracode-autopack:
    uses: GS-MAFTech/veracode-reusable-workflows/.github/workflows/veracode-AutoPackaging-PolicyScan-WithAppId.yml@dev
    with:
      appid: "3395427"
    secrets:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
