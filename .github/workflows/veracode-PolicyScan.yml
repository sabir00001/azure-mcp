name: Veracode Policy Scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 1 3,6,9,12 *'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERACODE_APP_ID: "3395427"

jobs:
  veracode-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and Publish Server
        run: |
          dotnet publish servers/Azure.Mcp.Server/src/Azure.Mcp.Server.csproj \
            --configuration Debug \
            --output "$RUNNER_TEMP/veracode-publish"

      - name: Package Build Output
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/veracode-publish"

          # Remove out-of-scope Azure.Mcp.Tools.* assemblies, keeping only VmDiagnostics and NetworkDiagnostics
          find . -maxdepth 1 -name 'Azure.Mcp.Tools.*' \
            ! -name 'Azure.Mcp.Tools.VmDiagnostics.*' \
            ! -name 'Azure.Mcp.Tools.NetworkDiagnostics.*' \
            -delete

          for assembly in \
            azmcp \
            Azure.Mcp.Core \
            Microsoft.Mcp.Core \
            Azure.Mcp.Tools.VmDiagnostics \
            Azure.Mcp.Tools.NetworkDiagnostics
          do
            for extension in dll pdb; do
              if [ ! -s "$assembly.$extension" ]; then
                echo "::error::Missing build output: $assembly.$extension"
                exit 1
              fi
            done
          done

          zip -rq "$GITHUB_WORKSPACE/veracode-build.zip" .
          du -h "$GITHUB_WORKSPACE/veracode-build.zip"

      - name: Upload and Run Policy Scan
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -o VeracodeJavaAPI.jar \
            "https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java/25.11.17.0/vosp-api-wrappers-java-25.11.17.0.jar"

          status=0
          java -jar VeracodeJavaAPI.jar \
            -vid "$VERACODE_API_ID" \
            -vkey "$VERACODE_API_KEY" \
            -action uploadandscanbyappid \
            -appid "$VERACODE_APP_ID" \
            -filepath veracode-build.zip \
            -version "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -scantimeout 30 \
            -scanpollinginterval 30 \
            -deleteincompletescan 2 \
            -toplevel true \
            -scanallnonfataltoplevelmodules true \
            -includenewmodules true \
            || status=$?

          if [ "$status" -eq 4 ]; then
            echo "::warning::Scan did not pass policy compliance."
          elif [ "$status" -ne 0 ]; then
            echo "::error::Veracode scan failed with exit code $status"
            exit "$status"
          fi

  get-policy-flaws:
    needs: veracode-scan
    runs-on: ubuntu-latest
    container:
      image: veracode/api-signing:latest
      options: --user root

    steps:
      - name: Get Policy Flaws
        shell: bash
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY }}
        run: |
          set -euo pipefail
          cd /tmp

          guid=$(http --check-status --auth-type veracode_hmac \
            GET "https://api.veracode.com/appsec/v1/applications?legacy_id=${VERACODE_APP_ID}" \
            | jq -er '._embedded.applications[0].guid')

          url="https://api.veracode.com/appsec/v2/applications/${guid}/findings"

          http --check-status --auth-type veracode_hmac \
            GET "${url}?scan_type=STATIC&violates_policy=True&page=0&size=100" \
            > policy_flaws.json

          total_pages=$(jq -er '.page.total_pages | numbers' policy_flaws.json)

          for ((page=1; page<total_pages; page++)); do
            http --check-status --auth-type veracode_hmac \
              GET "${url}?scan_type=STATIC&violates_policy=True&page=${page}&size=100" \
              > policy_flaws_page.json

            jq -s '
              .[0]._embedded.findings =
                ((.[0]._embedded.findings // []) +
                 (.[1]._embedded.findings // []))
              | .[0]
            ' policy_flaws.json policy_flaws_page.json \
              > policy_flaws_merged.json

            mv policy_flaws_merged.json policy_flaws.json
          done

      - name: Upload Flaws JSON
        uses: actions/upload-artifact@v4
        with:
          name: policy-flaws
          path: /tmp/policy_flaws.json
          if-no-files-found: error

  import-policy-flaws:
    needs: get-policy-flaws
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Download Flaws File
        uses: actions/download-artifact@v4
        with:
          name: policy-flaws
          path: /tmp

      - name: Create GitHub Issues
        uses: veracode/veracode-flaws-to-issues@v2.1.19
        with:
          scan-results-json: /tmp/policy_flaws.json
