name: Veracode SCA Scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 1 3,6,9,12 *'
  workflow_dispatch:

jobs:
  sca-scan:
    name: Scan repository with Veracode SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Scope Repository to In-Scope Projects
        run: |
          set -euo pipefail
          # Remove out-of-scope directories (eng, servers, unrelated tools/core) before restore and SCA scan
          rm -rf eng servers
          find core -mindepth 1 -maxdepth 1 \
            ! -name 'Azure.Mcp.Core' \
            ! -name 'Microsoft.Mcp.Core' \
            -exec rm -rf {} +
          find tools -mindepth 1 -maxdepth 1 \
            ! -name 'Azure.Mcp.Tools.VmDiagnostics' \
            ! -name 'Azure.Mcp.Tools.NetworkDiagnostics' \
            -exec rm -rf {} +

      - name: Restore .NET dependencies
        run: |
          dotnet restore core/Microsoft.Mcp.Core/src/Microsoft.Mcp.Core.csproj
          dotnet restore core/Azure.Mcp.Core/src/Azure.Mcp.Core.csproj
          dotnet restore tools/Azure.Mcp.Tools.VmDiagnostics/src/Azure.Mcp.Tools.VmDiagnostics.csproj
          dotnet restore tools/Azure.Mcp.Tools.NetworkDiagnostics/src/Azure.Mcp.Tools.NetworkDiagnostics.csproj

      - name: Run Veracode SCA
        uses: veracode/veracode-sca@v2.1.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          recursive: true
          no-graphs: true
          create-issues: false
          allow-dirty: true
          path: .
        env:
          SRCCLR_API_TOKEN: ${{ secrets.VERACODE_SCA_AGENT_TOKEN }}

